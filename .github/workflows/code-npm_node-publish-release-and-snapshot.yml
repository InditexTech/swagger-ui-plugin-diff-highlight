name: code-npm-node-publish-release-and-snapshot
run-name: Publish npm (release or snapshot) from ${{ github.event_name }}

# Single registrable top-level npm publish entrypoint (Topology B): npm trusted publishing keys on the workflow FILENAME, so the privileged `npm publish` runs INLINE here (never in a called reusable workflow) and both `workflow_ref` and `job_workflow_ref` resolve to this one file; snapshot and release lanes are separate jobs that hand a pre-built tarball to the pinned gh-actions/npm composite ACTION inside a reviewer-gated Environment, and the unprivileged build stage is the only one running candidate code.
on:
  # workflow_dispatch drives the RELEASE lane (it carries release_type); the snapshot lane fires on push / issue_comment only, so a manual dispatch never cuts a snapshot.
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type to use
        required: true
        default: release-type/minor
        type: choice
        options:
          - release-type/hotfix
          - release-type/multi-hotfix
          - release-type/major
          - release-type/minor
          - release-type/patch
  pull_request:
    types: [closed]
    branches: [main, main-*]
  push:
    branches: [main, main-*, develop, develop-*]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  # Lane-separated group key so snapshot and release runs never share a group: snapshot (push / issue_comment) is cancel-in-progress, release (pull_request / workflow_dispatch) is not.
  group: >-
    ${{ format('code-npm-node-publish-{0}-{1}', github.repository,
    (github.event_name == 'push' || github.event_name == 'issue_comment')
    && format('snapshot-{0}', github.event.issue.number || github.ref)
    || format('release-{0}', github.event.pull_request.base.ref || github.ref_name)) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'issue_comment' }}

env:
  PROJECT_TYPE: ${{ vars.PROJECT_TYPE }}
  WORKING_DIRECTORY: ${{ vars.WORKING_DIRECTORY }}
  PACKAGE_MANAGER: ${{ vars.PACKAGE_MANAGER }}
  ASDF_BRANCH_VERSION: '0.18.0'
  SNAPSHOT_ARTIFACT: npm-snapshot-dist

jobs:
  # Snapshot lane (jobs: authorize -> build -> publish).

  # Unprivileged pre-gate for /publish-snapshot: a cheap read-only filter, not a substitute for the reviewer-gated npm-snapshot Environment; resolves the PR head so the build stage checks out the reviewed commit.
  authorize:
    name: Authorize snapshot command
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/publish-snapshot') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve pull request head
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          # Read-only lookup of the PR head SHA; issue_comment carries the number, not the head commit.
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ -z "$head_sha" || "$head_sha" == "null" ]]; then
            echo "::error title=Unresolved head::Could not resolve the pull request head commit." >&2
            exit 1
          fi
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

  build:
    name: Build snapshot
    needs: [authorize]
    # Snapshot builds fire on the trusted release line (push) or an authorized /publish-snapshot comment only; workflow_dispatch is reserved for releases.
    if: >-
      !cancelled() &&
      (
        (
          github.event_name == 'push' &&
          (
            (vars.DEVELOPMENT_FLOW == 'trunk-based-development' && (github.ref_name == 'main' || startsWith(github.ref_name, 'main-'))) ||
            (vars.DEVELOPMENT_FLOW == 'git-flow' && (github.ref_name == 'develop' || startsWith(github.ref_name, 'develop-')))
          )
        ) ||
        (github.event_name == 'issue_comment' && needs.authorize.result == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
      should_publish: ${{ steps.plan.outputs.should_publish }}
    steps:
      - name: Check out snapshot candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: >-
            ${{
              (github.event_name == 'issue_comment' && needs.authorize.outputs.head_sha) ||
              github.sha
            }}

      - name: Plan snapshot
        id: plan
        env:
          PUBLISH_SNAPSHOT: ${{ vars.PUBLISH_SNAPSHOT }}
        shell: bash
        run: |
          set -euo pipefail
          # Snapshot publishing is opt-in (descriptor `publish_snapshot`, default off); an absent PUBLISH_SNAPSHOT variable disables the deploy on both the push and comment lanes.
          if [[ "${PUBLISH_SNAPSHOT:-false}" != "true" ]]; then
            echo "::notice title=Snapshot disabled::publish_snapshot opt-in is off; no snapshot is published."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The next-development commit already restores -SNAPSHOT, so skip it; key on the release-bot committer identity `<slug>[bot]@users.noreply.github.com` rather than the commit subject, which the project owns in delegated mode.
          head_committer_email="$(git show -s --format=%ce HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$head_committer_email" == *"[bot]@users.noreply.github.com" ]]; then
            echo "::notice title=Snapshot skipped::Next-dev commit does not need a snapshot."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Read governed tool versions
        id: tool-versions
        if: steps.plan.outputs.should_publish == 'true'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          # Reject any .tool-versions line that is not a strict "<plugin> <version>" before asdf reads it (npm is pinned via package.json packageManager, not here).
          if grep -Evq '^[a-zA-Z0-9_-]+ [a-zA-Z0-9._+-]+$' .tool-versions; then
            echo "::error title=Invalid tool-versions::${WORKING_DIRECTORY}/.tool-versions is malformed."
            exit 1
          fi
          {
            echo "tool_versions<<EOF"
            cat .tool-versions
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up asdf-managed Node
        if: steps.plan.outputs.should_publish == 'true'
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.0
        with:
          tool_versions: ${{ steps.tool-versions.outputs.tool_versions }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Build and pack snapshot
        id: pack
        if: steps.plan.outputs.should_publish == 'true'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          DIST_DIR: ${{ runner.temp }}/snapshot-dist
        shell: bash
        run: |
          set -euo pipefail

          strip_snapshot() { printf '%s' "${1%-SNAPSHOT}"; }
          compute_snapshot() {  # <base X.Y.Z> -> snapshot version for this run
            if [[ "$GITHUB_EVENT_NAME" == "issue_comment" ]]; then
              # On-demand PR-head snapshot: encode the PR number so concurrent PRs never collide on the `next` dist-tag.
              printf '%s-PR%s-SNAPSHOT.%s' "$1" "$PR_NUMBER" "$GITHUB_RUN_NUMBER"
            else
              # Trusted release-line snapshot: run number + attempt keep every re-run monotonic and unique.
              printf '%s-SNAPSHOT.%s.%s' "$1" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
            fi
          }
          member_dir() {  # <npm package name> -> flat workspaces member directory
            printf '%s' "${1##*/}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//'
          }

          mkdir -p "$DIST_DIR"

          # Install, build, stamp the run-unique snapshot version per unit (no lifecycle scripts), then pack the pre-built tree; npm packs workspaces in one call while pnpm packs each member from its own dir, and `npm pkg set` stamps versions in both paths without touching any lockfile.
          case "${PACKAGE_MANAGER:-npm}" in
            npm)
              npm ci
              npm run build
              case "$PROJECT_TYPE" in
                single)
                  base="$(strip_snapshot "$(jq -r '.version' package.json)")"
                  npm pkg set "version=$(compute_snapshot "$base")"
                  npm pack --pack-destination "$DIST_DIR"
                  ;;
                workspaces)
                  descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-node.json"
                  while IFS= read -r package; do
                    member="$(member_dir "$package")"
                    base="$(strip_snapshot "$(jq -r '.version' "packages/$member/package.json")")"
                    npm pkg set "version=$(compute_snapshot "$base")" --workspace "packages/$member"
                  done < <(jq -er '.release.packages[]' "$descriptor")
                  npm pack --workspaces --pack-destination "$DIST_DIR"
                  ;;
                *)
                  echo "::error title=Invalid project type::PROJECT_TYPE must be single or workspaces."
                  exit 1
                  ;;
              esac
              ;;
            pnpm)
              # Corepack activates the exact pnpm pinned in the product's package.json "packageManager" field: no floating pnpm, no product edit.
              corepack enable
              pnpm install --frozen-lockfile
              pnpm run build
              case "$PROJECT_TYPE" in
                single)
                  base="$(strip_snapshot "$(jq -r '.version' package.json)")"
                  npm pkg set "version=$(compute_snapshot "$base")"
                  pnpm pack --pack-destination "$DIST_DIR"
                  ;;
                workspaces)
                  descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-node.json"
                  while IFS= read -r package; do
                    member="$(member_dir "$package")"
                    base="$(strip_snapshot "$(jq -r '.version' "packages/$member/package.json")")"
                    ( cd "packages/$member" && npm pkg set "version=$(compute_snapshot "$base")" )
                    ( cd "packages/$member" && pnpm pack --pack-destination "$DIST_DIR" )
                  done < <(jq -er '.release.packages[]' "$descriptor")
                  ;;
                *)
                  echo "::error title=Invalid project type::PROJECT_TYPE must be single or workspaces."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error title=Invalid package manager::PACKAGE_MANAGER must be npm or pnpm."
              exit 1
              ;;
          esac

          echo "artifact_name=${SNAPSHOT_ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Upload snapshot artifact
        if: steps.plan.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.SNAPSHOT_ARTIFACT }}
          path: ${{ runner.temp }}/snapshot-dist/*.tgz
          if-no-files-found: error
          retention-days: 5

  # Publish stage: no candidate code runs here. The privileged npm publish is INLINE in this top-level file (so OIDC job_workflow_ref == the registered workflow_ref), granting id-token: write only at this reviewer-gated npm-snapshot boundary to ship the pre-built tarball.
  publish:
    name: Publish snapshot
    needs: [build]
    # Deploy is gated on the descriptor snapshot opt-in (belt-and-suspenders with the Plan step's should_publish): the credential-bearing deploy never runs unless publish_snapshot is enabled.
    if: >-
      !cancelled() &&
      needs.build.outputs.should_publish == 'true' &&
      vars.PUBLISH_SNAPSHOT == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-snapshot
    permissions:
      contents: read
      id-token: write # The npm trusted-publishing OIDC boundary, inline in the registered top-level file.
    env:
      # Environment-scoped fallback for a package not yet a registered trusted publisher; set at JOB level so the composite's run steps inherit it, and unreachable from the build stage.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out trusted publish ref
        # Its own trusted ref, never the candidate head; the reviewed bytes ship as the pre-built artifact only.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download pre-built snapshot artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/publish-dist

      - name: Publish via npm trusted publishing
        # The composite publishes each pre-built tarball with --ignore-scripts, sets the dist-tag, enables provenance only when the repository is public, and falls back to NPM_TOKEN for an unregistered package.
        uses: InditexTech/gh-actions/npm@5159a0213e29a091bf732553681a0de8ac712d17 # gh-actions/npm composite @ main; no release tag yet
        with:
          working-directory: ${{ vars.WORKING_DIRECTORY }}
          project-type: ${{ vars.PROJECT_TYPE }}
          dist-tag: next
          artifact-directory: ${{ runner.temp }}/publish-dist
        # NPM_TOKEN is provided at job level: a composite's run steps do not inherit a caller step's env.

  # Release lane (jobs: release-core -> publish-npm -> github-release).

  release-core:
    name: Prepare and Build Release
    # Lane routing: the release cut runs only on release triggers, never on a push / comment (those drive the snapshot lane above).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    uses: ./.github/workflows/code-npm_node-release-core.yml
    with:
      release_type: ${{ inputs.release_type }}
    secrets: inherit

  # Govern-inject publish path: release-core packed the tarballs and THIS top-level file publishes them INLINE (so OIDC job_workflow_ref == the registered workflow_ref) through the pinned gh-actions/npm composite, holding id-token: write only in this reviewer-gated boundary; skipped in delegated mode.
  publish-npm:
    name: Publish ${{ matrix.release.tag }} to npm
    needs: release-core
    if: vars.RELEASE_LIFECYCLE != 'delegated'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-registry
    permissions:
      contents: read
      id-token: write # The npm trusted-publishing OIDC boundary, inline in the registered top-level file.
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release-core.outputs.releases) }}
    env:
      # Environment-scoped fallback for a package not yet a registered trusted publisher; set at JOB level so the composite's run steps inherit it.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check out trusted publish ref
        # Its own trusted ref, never a candidate head; the release bytes ship as the pre-built artifact only.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download pre-built release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-distributions-${{ matrix.release.tag }}
          path: ${{ runner.temp }}/publish-dist

      - name: Publish via npm trusted publishing
        # The composite publishes each pre-built tarball with --ignore-scripts, sets the dist-tag, enables provenance only when the repository is public, and falls back to NPM_TOKEN for an unregistered package.
        uses: InditexTech/gh-actions/npm@5159a0213e29a091bf732553681a0de8ac712d17 # gh-actions/npm composite @ main; no release tag yet
        with:
          working-directory: ${{ vars.WORKING_DIRECTORY }}
          project-type: ${{ vars.PROJECT_TYPE }}
          dist-tag: latest
          artifact-directory: ${{ runner.temp }}/publish-dist
        # NPM_TOKEN is provided at job level: a composite's run steps do not inherit a caller step's env.

  # Delegated publish path: the project's own release:perform runs under the reviewer-gated npm-registry Environment with the ENV-TOKEN (NPM_TOKEN), NEVER id-token, and is trusted-trigger-only so it carries no pwn-request surface; the inline publish-npm job above stays the SOLE id-token boundary, preserving the single-registrable-entrypoint invariant.
  publish-npm-delegated:
    name: Publish delegated release to npm
    needs: release-core
    if: >-
      vars.RELEASE_LIFECYCLE == 'delegated' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-registry
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-core.outputs.release_commit }}

      - name: Read governed tool versions
        id: tool-versions
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Evq '^[a-zA-Z0-9_-]+ [a-zA-Z0-9._+-]+$' .tool-versions; then
            echo "::error title=Invalid tool-versions::${WORKING_DIRECTORY}/.tool-versions is malformed."
            exit 1
          fi
          {
            echo "tool_versions<<EOF"
            cat .tool-versions
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up asdf-managed Node
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.0
        with:
          tool_versions: ${{ steps.tool-versions.outputs.tool_versions }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Install dependencies
        # No publish credential in scope here, so dependency install scripts never see NPM_TOKEN; the token is added only to the release:perform step below.
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          # Package manager defaults to npm; pnpm is provisioned via corepack from the product's packageManager pin.
          case "${PACKAGE_MANAGER:-npm}" in
            npm)  npm ci ;;
            pnpm) corepack enable; pnpm install --frozen-lockfile ;;
            *)    echo "::error title=Invalid package manager::PACKAGE_MANAGER must be npm or pnpm."; exit 1 ;;
          esac

      - name: Run project release:perform
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          # Reviewer-gated Environment secret and the sole publish credential in the delegated lane; no id-token is minted here.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The release commit already passed verify and its tags are pushed; the project's release:perform publishes the tagged versions through its own package manager (corepack enabled above) and owns the publish shape.
          case "${PACKAGE_MANAGER:-npm}" in
            npm)  npm run release:perform ;;
            pnpm) pnpm run release:perform ;;
            *)    echo "::error title=Invalid package manager::PACKAGE_MANAGER must be npm or pnpm."; exit 1 ;;
          esac

  github-release:
    name: Create GitHub Release ${{ matrix.release.tag }}
    needs: [release-core, publish-npm, publish-npm-delegated]
    # Tolerate whichever publish path was skipped for the active lifecycle.
    if: >-
      !cancelled() &&
      needs.release-core.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-npm-delegated.result == 'success' || needs.publish-npm-delegated.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.release-core.outputs.releases) }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Download release distributions
        # Govern-inject only: the engine packed tarballs to attach; in delegated mode release:perform published directly, so the Release carries generated notes only.
        if: vars.RELEASE_LIFECYCLE != 'delegated'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-distributions-${{ matrix.release.tag }}
          path: dist

      - name: Create or update GitHub Release
        # release-core already created and pushed the annotated tag; this attaches the packed tarballs in govern-inject and is notes-only in delegated, with --clobber keeping re-runs idempotent.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ matrix.release.tag }}
          RELEASE_VERSION: ${{ matrix.release.version }}
          RELEASE_LIFECYCLE: ${{ vars.RELEASE_LIFECYCLE }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.tgz)
          if [[ "$RELEASE_LIFECYCLE" != "delegated" && ${#assets[@]} -eq 0 ]]; then
            echo "::error title=Missing distributions::The release artifact is empty."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [[ ${#assets[@]} -gt 0 ]]; then
              gh release upload "$RELEASE_TAG" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_VERSION" \
              --generate-notes
          fi
